[package]
name = "nc-cable"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
description = "Virtual audio cable for Linux (PipeWire): everything played into the cable input comes out of the cable output"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
pipewire = { version = "0.10.1", features = ["v0_3_77"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"

[profile.release]
lto = true
codegen-units = 1
